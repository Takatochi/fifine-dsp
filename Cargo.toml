[workspace]
resolver = "2"
members = [
    "crates/fifine-domain",
    "crates/fifine-dsp",
    "crates/fifine-engine",
    "crates/fifine-hal",
    "crates/fifine-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
cpal = "0.15"
nnnoiseless = "0.5"
ringbuf = "0.4"
