<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <!-- Window Frame -->
  <rect width="920" height="420" rx="12" fill="url(#termBg)" stroke="#30363d" stroke-width="2"/>
  <rect width="920" height="36" rx="12" fill="#21262d"/>
  <rect y="24" width="920" height="12" fill="#21262d"/>

  <!-- Window Controls -->
  <circle cx="22" cy="18" r="6.5" fill="#ff5f56"/>
  <circle cx="42" cy="18" r="6.5" fill="#ffbd2e"/>
  <circle cx="62" cy="18" r="6.5" fill="#27c93f"/>
  <text x="460" y="23" text-anchor="middle" fill="#8b949e" font-family="Consolas, 'JetBrains Mono', monospace" font-size="13">
    fifine-cli — Real-Time DSP Engine (48 kHz, Lock-Free SPSC)
  </text>

  <!-- Terminal Content -->
  <g transform="translate(24, 62)" font-family="Consolas, 'JetBrains Mono', monospace" font-size="13.5">
    <!-- Command 1: List Profiles -->
    <text x="0" y="0" fill="#58a6ff">$</text>
    <text x="16" y="0" fill="#e6edf3">cargo run --release -p fifine-cli -- --profiles</text>

    <text x="0" y="26" fill="#7ee787">k689  </text>
    <text x="52" y="26" fill="#e6edf3">| FIFINE K689 (Condenser USB)            | Condenser | HPF: 85 Hz | Gate: 35%</text>

    <text x="0" y="48" fill="#79c0ff">k688  </text>
    <text x="52" y="48" fill="#8b949e">| FIFINE K688 (Dynamic Podcast USB/XLR)  | Dynamic   | HPF: 75 Hz | Gate: 20%</text>

    <text x="0" y="70" fill="#79c0ff">am8   </text>
    <text x="52" y="70" fill="#8b949e">| FIFINE AmpliGame AM8 (Dynamic USB/XLR) | Dynamic   | HPF: 80 Hz | Gate: 25%</text>

    <text x="0" y="92" fill="#79c0ff">k669  </text>
    <text x="52" y="92" fill="#8b949e">| FIFINE K669/K669B (Condenser USB)      | Condenser | HPF: 90 Hz | Gate: 40%</text>

    <!-- Command 2: Run Real-Time Engine -->
    <text x="0" y="132" fill="#58a6ff">$</text>
    <text x="16" y="132" fill="#e6edf3">cargo run --release -p fifine-cli -- --profile k689 --out "CABLE Input"</text>

    <text x="0" y="162" fill="#8b949e">Profile :</text>
    <text x="85" y="162" fill="#d2a8ff" font-weight="700">FIFINE K689 (Condenser USB) (k689)</text>

    <text x="0" y="184" fill="#8b949e">Input   :</text>
    <text x="85" y="184" fill="#e6edf3">Microphone (FIFINE K689 Microphone) [48000 Hz, F32]</text>

    <text x="0" y="206" fill="#8b949e">Output  :</text>
    <text x="85" y="206" fill="#e6edf3">CABLE Input (VB-Audio Virtual Cable) [48000 Hz, F32]</text>

    <!-- Active DSP Chain Badges -->
    <g transform="translate(0, 226)">
      <rect x="0" y="0" width="96" height="24" rx="5" fill="#238636" fill-opacity="0.25" stroke="#2ea043"/>
      <text x="48" y="16" text-anchor="middle" fill="#7ee787" font-size="11.5">1. HPF 85Hz</text>

      <text x="104" y="16" fill="#8b949e">→</text>

      <rect x="120" y="0" width="124" height="24" rx="5" fill="#238636" fill-opacity="0.25" stroke="#2ea043"/>
      <text x="182" y="16" text-anchor="middle" fill="#7ee787" font-size="11.5">2. RNNoise AI</text>

      <text x="252" y="16" fill="#8b949e">→</text>

      <rect x="268" y="0" width="124" height="24" rx="5" fill="#238636" fill-opacity="0.25" stroke="#2ea043"/>
      <text x="330" y="16" text-anchor="middle" fill="#7ee787" font-size="11.5">3. VAD Gate 35%</text>

      <text x="400" y="16" fill="#8b949e">→</text>

      <rect x="416" y="0" width="124" height="24" rx="5" fill="#1f6feb" fill-opacity="0.25" stroke="#388bfd"/>
      <text x="478" y="16" text-anchor="middle" fill="#79c0ff" font-size="11.5">4. 3-Band EQ</text>

      <text x="548" y="16" fill="#8b949e">→</text>

      <rect x="564" y="0" width="132" height="24" rx="5" fill="#1f6feb" fill-opacity="0.25" stroke="#388bfd"/>
      <text x="630" y="16" text-anchor="middle" fill="#79c0ff" font-size="11.5">5. Comp 3.0:1</text>

      <text x="704" y="16" fill="#8b949e">→</text>

      <rect x="720" y="0" width="136" height="24" rx="5" fill="#8957e5" fill-opacity="0.25" stroke="#a371f7"/>
      <text x="788" y="16" text-anchor="middle" fill="#d2a8ff" font-size="11.5">6. Limiter -0.5dB</text>
    </g>

    <!-- Live Telemetry Bar -->
    <g transform="translate(0, 276)">
      <rect x="0" y="0" width="872" height="48" rx="8" fill="#090d13" stroke="#30363d"/>
      <circle cx="20" cy="24" r="5" fill="#3fb950"/>
      <text x="36" y="29" fill="#7ee787" font-weight="700">VAD:  98.4%</text>
      <text x="148" y="29" fill="#30363d">|</text>
      <text x="168" y="29" fill="#79c0ff" font-weight="700">Peak:  68.2%</text>
      <text x="290" y="29" fill="#30363d">|</text>
      <text x="310" y="29" fill="#e6edf3">Underrun: <tspan fill="#3fb950">0</tspan></text>
      <text x="430" y="29" fill="#30363d">|</text>
      <text x="450" y="29" fill="#e6edf3">Overrun: <tspan fill="#3fb950">0</tspan></text>
      <text x="565" y="29" fill="#30363d">|</text>
      <text x="585" y="29" fill="#e6edf3">Drift: <tspan fill="#3fb950">0</tspan></text>
      <text x="675" y="29" fill="#30363d">|</text>
      <text x="695" y="29" fill="#8b949e">Frame: <tspan fill="#d2a8ff">10.0 ms (0 allocs)</tspan></text>
    </g>
  </g>
</svg>
